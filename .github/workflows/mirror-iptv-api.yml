name: Mirror iptv-api to ghcr.io

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and push guovern/iptv-api
        run: |
          docker pull guovern/iptv-api:latest
          docker tag guovern/iptv-api:latest ghcr.io/${{ github.repository_owner }}/iptv-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/iptv-api:latest
